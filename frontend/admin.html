<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin — Document Chatbot</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e37;
    --accent: #5b8cff;
    --text: #e7e9ee;
    --muted: #9aa1ac;
    --danger: #ff5b6e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px;
  }
  h1 { font-size: 18px; margin: 0; }
  a.back { color: var(--muted); font-size: 13px; text-decoration: none; }
  a.back:hover { color: var(--accent); }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

  input[type="file"] {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--text);
    margin-bottom: 12px;
  }
  button {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.danger { background: var(--danger); padding: 6px 12px; font-size: 12px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .status { font-size: 13px; margin-top: 10px; }
  .status.ok { color: #4ade80; }
  .status.err { color: var(--danger); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⚙️ Admin — Document Management</h1>
    <a class="back" href="/index.html">← Back to chat</a>
  </header>

  <div class="card">
    <h2>Upload a document</h2>
    <form id="uploadForm">
      <input type="file" id="fileInput" accept=".pdf,.docx,.txt" required />
      <button type="submit" id="uploadBtn">Upload &amp; Index</button>
    </form>
    <div id="uploadStatus" class="status"></div>
  </div>

  <div class="card">
    <h2>Indexed documents</h2>
    <table id="docsTable">
      <thead><tr><th>Document</th><th>Chunks</th><th></th></tr></thead>
      <tbody id="docsBody"></tbody>
    </table>
    <div id="emptyState" class="empty" style="display:none;">No documents indexed yet.</div>
  </div>
</div>

<script>
const API_BASE = "";

async function loadDocuments() {
  const res = await fetch(API_BASE + "/admin/documents");
  const docs = await res.json();
  const body = document.getElementById("docsBody");
  const empty = document.getElementById("emptyState");
  body.innerHTML = "";

  if (!docs.length) {
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  docs.forEach(doc => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${doc.doc_name}</td>
      <td>${doc.chunks}</td>
      <td><button class="danger" data-doc="${doc.doc_name}">Delete</button></td>
    `;
    body.appendChild(tr);
  });

  document.querySelectorAll("button.danger").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (!confirm(`Delete "${btn.dataset.doc}" from the index?`)) return;
      await fetch(API_BASE + "/admin/documents/" + encodeURIComponent(btn.dataset.doc), {
        method: "DELETE",
      });
      loadDocuments();
    });
  });
}

document.getElementById("uploadForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fileInput = document.getElementById("fileInput");
  const statusEl = document.getElementById("uploadStatus");
  const uploadBtn = document.getElementById("uploadBtn");
  if (!fileInput.files.length) return;

  const formData = new FormData();
  formData.append("file", fileInput.files[0]);

  uploadBtn.disabled = true;
  statusEl.className = "status";
  statusEl.textContent = "Uploading and indexing... this can take a while for large documents.";

  try {
    const res = await fetch(API_BASE + "/admin/upload", { method: "POST", body: formData });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Upload failed");

    statusEl.className = "status ok";
    statusEl.textContent = `Indexed "${data.doc_name}" — ${data.chunks_added} chunks added.`;
    fileInput.value = "";
    loadDocuments();
  } catch (err) {
    statusEl.className = "status err";
    statusEl.textContent = "Error: " + err.message;
  } finally {
    uploadBtn.disabled = false;
  }
});

loadDocuments();
</script>
</body>
</html>
