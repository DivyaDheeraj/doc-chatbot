<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Document Chatbot</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --border: #2a2e37;
        --accent: #5b8cff;
        --text: #e7e9ee;
        --muted: #9aa1ac;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f4f5f7;
        height: 100vh;
      }

      /* ---- Floating launcher button ---- */
      #chatLauncher {
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: var(--accent);
        color: white;
        border: none;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        cursor: pointer;
        font-size: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        transition: transform 0.15s ease;
      }
      #chatLauncher:hover {
        transform: scale(1.08);
      }

      #chatLauncher .badge {
        position: absolute;
        top: -4px;
        right: -4px;
        background: #ff5b6e;
        color: white;
        font-size: 11px;
        font-weight: 700;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        display: none;
        align-items: center;
        justify-content: center;
      }

      /* ---- Chat window ---- */
      #chatWindow {
        position: fixed;
        bottom: 100px;
        right: 24px;
        width: 360px;
        height: 520px;
        max-height: 75vh;
        background: var(--bg);
        color: var(--text);
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
        display: none;
        flex-direction: column;
        overflow: hidden;
        z-index: 1000;
        border: 1px solid var(--border);
      }
      #chatWindow.open {
        display: flex;
      }

      #chatHeader {
        padding: 14px 16px;
        background: var(--accent);
        color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-weight: 600;
        font-size: 14px;
      }
      #chatHeader .sub {
        font-weight: 400;
        font-size: 11px;
        opacity: 0.85;
        display: block;
        margin-top: 2px;
      }
      #closeChat {
        background: none;
        border: none;
        color: white;
        font-size: 20px;
        cursor: pointer;
        line-height: 1;
        padding: 4px;
      }

      #chatMessages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .msg {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-width: 85%;
      }
      .msg.user {
        align-self: flex-end;
        align-items: flex-end;
      }
      .msg.bot {
        align-self: flex-start;
        align-items: flex-start;
      }
      .bubble {
        padding: 9px 12px;
        border-radius: 12px;
        line-height: 1.4;
        font-size: 13.5px;
        white-space: pre-wrap;
      }
      .msg.user .bubble {
        background: var(--accent);
        color: white;
        border-bottom-right-radius: 4px;
      }
      .msg.bot .bubble {
        background: var(--panel);
        border: 1px solid var(--border);
        border-bottom-left-radius: 4px;
      }
      .sources {
        font-size: 10.5px;
        color: var(--muted);
      }
      .typing {
        color: var(--muted);
        font-size: 12.5px;
        font-style: italic;
      }

      #chatInputBar {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid var(--border);
        background: var(--bg);
      }
      #queryInput {
        flex: 1;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        font-size: 13.5px;
        outline: none;
      }
      #queryInput:focus {
        border-color: var(--accent);
      }
      #sendBtn {
        padding: 10px 16px;
        border-radius: 10px;
        border: none;
        background: var(--accent);
        color: white;
        font-weight: 600;
        cursor: pointer;
        font-size: 13.5px;
      }
      #sendBtn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      #adminLink {
        position: fixed;
        bottom: 24px;
        left: 24px;
        font-size: 12px;
        color: #6b7280;
        text-decoration: none;
        z-index: 1000;
      }
      #adminLink:hover {
        color: var(--accent);
      }

      #docCard {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 40px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .docIcon { font-size: 40px; margin-bottom: 12px; }
  .docName {
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 18px;
    max-width: 320px;
    word-break: break-word;
  }
  .docViewBtn {
    display: inline-block;
    background: var(--accent);
    color: white;
    padding: 10px 24px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 600;
  }
  .docViewBtn:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <a id="adminLink" href="/admin.html">Admin: manage documents</a>

    <div id="docCard">
  <div class="docIcon">📄</div>
  <div class="docName">Latest_Updates_ADAS.pdf</div>
  <a href="/view.html" target="_blank" class="docViewBtn">View Document</a>
</div>

    <!-- Floating launcher icon -->
    <button id="chatLauncher" aria-label="Open chat">
      💬
      <span class="badge" id="chatBadge">1</span>
    </button>

    <!-- Chat window -->
    <div id="chatWindow">
      <div id="chatHeader">
        <div>
          Document Chatbot
          <span class="sub">Answers only from your uploaded document(s)</span>
        </div>
        <button id="closeChat" aria-label="Close chat">✕</button>
      </div>

      <div id="chatMessages">
        <div class="msg bot">
          <div class="bubble">
            Hi! Ask me anything about the uploaded document(s). I'll only answer
            from what's actually in there.
          </div>
        </div>
      </div>

      <form id="chatInputBar">
        <input
          id="queryInput"
          type="text"
          placeholder="Ask a question..."
          autocomplete="off"
        />
        <button type="submit" id="sendBtn">Send</button>
      </form>
    </div>

    <script>
      const API_BASE = "";
      const launcher = document.getElementById("chatLauncher");
      const chatWindow = document.getElementById("chatWindow");
      const closeChat = document.getElementById("closeChat");
      const badge = document.getElementById("chatBadge");
      const chat = document.getElementById("chatMessages");
      const form = document.getElementById("chatInputBar");
      const input = document.getElementById("queryInput");
      const sendBtn = document.getElementById("sendBtn");

      let opened = false;

      launcher.addEventListener("click", () => {
        chatWindow.classList.toggle("open");
        opened = true;
        badge.style.display = "none";
        if (chatWindow.classList.contains("open")) {
          input.focus();
          chat.scrollTop = chat.scrollHeight;
        }
      });

      closeChat.addEventListener("click", () => {
        chatWindow.classList.remove("open");
      });

      function addMessage(role, text, sources) {
        const msg = document.createElement("div");
        msg.className = "msg " + role;

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        msg.appendChild(bubble);

        if (sources && sources.length) {
          const src = document.createElement("div");
          src.className = "sources";
          const unique = [...new Set(sources.map((s) => s.doc_name))];
          src.textContent = "Sources: " + unique.join(", ");
          msg.appendChild(src);
        }

        chat.appendChild(msg);
        chat.scrollTop = chat.scrollHeight;
        return msg;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const query = input.value.trim();
        if (!query) return;

        addMessage("user", query);
        input.value = "";
        sendBtn.disabled = true;

        const typingMsg = addMessage("bot", "Thinking...");
        typingMsg.querySelector(".bubble").classList.add("typing");

        try {
          const res = await fetch(API_BASE + "/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query }),
          });
          if (!res.ok) throw new Error("Request failed: " + res.status);
          const data = await res.json();

          typingMsg.remove();
          addMessage("bot", data.answer, data.sources);

          if (!chatWindow.classList.contains("open")) {
            badge.style.display = "flex";
          }
        } catch (err) {
          typingMsg.remove();
          addMessage(
            "bot",
            "Error: could not reach the server. Is the backend running?",
          );
          console.error(err);
        } finally {
          sendBtn.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
