<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Document Chatbot</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --border: #2a2e37;
        --accent: #5b8cff;
        --text: #e7e9ee;
        --muted: #9aa1ac;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f4f5f7;
        height: 100vh;
        position: relative;
      }

      #adminLink {
        position: fixed;
        bottom: 24px;
        left: 24px;
        font-size: 12px;
        color: #6b7280;
        text-decoration: none;
        z-index: 1000;
      }
      #adminLink:hover {
        color: var(--accent);
      }

      #docCardContainer {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
        max-width: 700px;
      }
      .docCard {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px 28px;
        text-align: center;
        box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        width: 200px;
      }
      .docIcon { font-size: 32px; margin-bottom: 10px; }
      .docName {
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 14px;
        word-break: break-word;
      }
      .docViewBtn {
        display: inline-block;
        background: var(--accent);
        color: white;
        padding: 8px 18px;
        border-radius: 10px;
        text-decoration: none;
        font-size: 12.5px;
        font-weight: 600;
      }
      .docViewBtn:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <a id="adminLink" href="/admin.html">Admin: manage documents</a>

    <div id="docCardContainer"></div>

    <script>
      const API_BASE = "";

      async function loadDocumentCards() {
        try {
          const res = await fetch(API_BASE + "/admin/documents");
          const docs = await res.json();
          const container = document.getElementById("docCardContainer");
          container.innerHTML = "";

          if (!docs.length) {
            container.innerHTML = '<div style="color:#9aa1ac;font-size:14px;">No documents indexed yet. Go to Admin to upload one.</div>';
            return;
          }

          docs.forEach(doc => {
            const card = document.createElement("div");
            card.className = "docCard";
            card.innerHTML = `
              <div class="docIcon">📄</div>
              <div class="docName">${doc.doc_name}</div>
              <a href="/view.html?doc=${encodeURIComponent(doc.doc_name)}" target="_blank" class="docViewBtn">View Document</a>
            `;
            container.appendChild(card);
          });
        } catch (err) {
          console.error("Failed to load documents:", err);
        }
      }

      loadDocumentCards();
    </script>
  </body>
</html>
