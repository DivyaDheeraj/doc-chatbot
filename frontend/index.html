<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Document Chatbot</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e37;
    --accent: #5b8cff;
    --text: #e7e9ee;
    --muted: #9aa1ac;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; }
  header a { color: var(--muted); font-size: 13px; text-decoration: none; }
  header a:hover { color: var(--accent); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
  }
  .msg { display: flex; flex-direction: column; gap: 4px; max-width: 85%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.45;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .msg.user .bubble { background: var(--accent); color: white; border-bottom-right-radius: 4px; }
  .msg.bot .bubble { background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .sources { font-size: 11px; color: var(--muted); }

  form#inputBar {
    display: flex;
    gap: 8px;
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
  }
  #queryInput {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  #queryInput:focus { border-color: var(--accent); }
  button {
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .typing { color: var(--muted); font-size: 13px; font-style: italic; }
</style>
</head>
<body>

<header>
  <h1>📄 Document Chatbot</h1>
  <a href="/admin.html">Admin: manage documents →</a>
</header>

<div id="chat">
  <div class="msg bot">
    <div class="bubble">Hi! Ask me anything about the uploaded document(s). I'll only answer from what's actually in there.</div>
  </div>
</div>

<form id="inputBar">
  <input id="queryInput" type="text" placeholder="Ask a question about the document..." autocomplete="off" />
  <button type="submit" id="sendBtn">Send</button>
</form>

<script>
const API_BASE = ""; // same origin (served by FastAPI). Change if hosting separately.
const chat = document.getElementById("chat");
const form = document.getElementById("inputBar");
const input = document.getElementById("queryInput");
const sendBtn = document.getElementById("sendBtn");

function addMessage(role, text, sources) {
  const msg = document.createElement("div");
  msg.className = "msg " + role;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  msg.appendChild(bubble);

  if (sources && sources.length) {
    const src = document.createElement("div");
    src.className = "sources";
    const unique = [...new Set(sources.map(s => s.doc_name))];
    src.textContent = "Sources: " + unique.join(", ");
    msg.appendChild(src);
  }

  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return msg;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const query = input.value.trim();
  if (!query) return;

  addMessage("user", query);
  input.value = "";
  sendBtn.disabled = true;

  const typingMsg = addMessage("bot", "Thinking...");
  typingMsg.querySelector(".bubble").classList.add("typing");

  try {
    const res = await fetch(API_BASE + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query }),
    });
    if (!res.ok) throw new Error("Request failed: " + res.status);
    const data = await res.json();

    typingMsg.remove();
    addMessage("bot", data.answer, data.sources);
  } catch (err) {
    typingMsg.remove();
    addMessage("bot", "Error: could not reach the server. Is the backend running?");
    console.error(err);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>

</body>
</html>
